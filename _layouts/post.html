<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | DissentVerse</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #222;
      font-family: "DM Sans", sans-serif;
    }

    a {
      text-decoration: none;
    }


    /* =========================
       COMMENT SECTION
    ========================= */

    .comments-section {
      max-width: 850px;
      margin: 70px auto;
      padding: 0 20px;
    }

    .comments-title {
      font-family: "Lora", serif;
      font-size: 30px;
      margin-bottom: 25px;
    }

    .comment-item {
      padding: 20px 0;
      border-bottom: 1px solid #eee;
    }

    .comment-author {
      font-weight: 700;
      color: #3f174f;
      margin-bottom: 7px;
    }

    .comment-text {
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .comment-date {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
    }

    .comment-reply-btn {
      margin-top: 12px;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: #f3e8f7;
      color: #5b1b70;
      cursor: pointer;
      font-size: 13px;
    }

    .comment-reply-btn:hover {
      background: #e8d7ee;
    }

    .comment-replies {
      margin-top: 15px;
      margin-left: 25px;
      padding-left: 18px;
      border-left: 2px solid #eee;
    }

    .reply-item {
      padding: 15px 0;
    }

    .reply-box {
      margin-top: 15px;
      padding: 15px;
      background: #faf7fb;
      border-radius: 8px;
    }

    .reply-box textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      margin-bottom: 10px;
    }

    .reply-submit-btn,
    .reply-cancel-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 7px;
    }

    .reply-submit-btn {
      background: #5b1b70;
      color: white;
    }

    .reply-cancel-btn {
      background: #eee;
      color: #333;
    }


    /* =========================
       COMMENT FORM
    ========================= */

    .comment-form {
      margin-top: 35px;
      padding: 25px;
      background: #faf7fb;
      border-radius: 10px;
    }

    .comment-form input,
    .comment-form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
    }

    .comment-form textarea {
      min-height: 120px;
      resize: vertical;
    }

    .comment-form button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #5b1b70;
      color: white;
      cursor: pointer;
    }

    .anonymous-option {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }


    /* =========================
       COMMENT CHOICE
    ========================= */

    .comment-choice {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .comment-choice.show {
      display: flex;
    }

    .comment-choice-box {
      width: min(420px, 90%);
      background: white;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
    }

    .comment-choice-box h3 {
      margin-top: 0;
      font-family: "Lora", serif;
    }

    .comment-choice-box button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    #anonymousCommentBtn {
      background: #5b1b70;
      color: white;
    }

    #createAccountBtn,
    #signInBtn {
      background: #f3e8f7;
      color: #5b1b70;
    }

    #closeCommentChoice {
      margin-top: 15px;
      background: #eee;
      color: #333;
    }
  </style>
</head>


<body>

  <!-- =========================
       COMMENT CHOICE
  ========================= -->

  <div
    id="commentChoice"
    class="comment-choice"
  >

    <div class="comment-choice-box">

      <h3>Join the conversation</h3>

      <p>
        Choose how you would like to comment.
      </p>

      <button id="anonymousCommentBtn">
        Continue as Anonymous
      </button>

      <button id="createAccountBtn">
        Create an Account
      </button>

      <button id="signInBtn">
        Sign In
      </button>

      <button id="closeCommentChoice">
        Cancel
      </button>

    </div>

  </div>


  <!-- =========================
       COMMENTS
  ========================= -->

  <section
    id="commentsSection"
    class="comments-section"
  >

    <h2 class="comments-title">
      Comments
    </h2>


    <!-- COMMENT FORM -->

    <div class="comment-form">

      <input
        id="commentName"
        type="text"
        placeholder="Your name"
      >

      <label class="anonymous-option">

        <input
          id="anonymousCheckbox"
          type="checkbox"
        >

        Comment anonymously

      </label>


      <textarea
        id="commentText"
        placeholder="Write a comment..."
      ></textarea>


      <button
        id="postCommentButton"
        type="button"
      >
        Post Comment
      </button>

    </div>


    <!-- COMMENTS LIST -->

    <div id="commentsList"></div>

  </section>


  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>

  <script>

  const SUPABASE_URL =
    "https://yplvpgigfkihgmyfsqyl.supabase.co";

  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwbHZwZ2lnZmtpaGdteWZzcXlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMzkyNzksImV4cCI6MjEwNTYxNTI3OX0.9nHT9NIDBH3ndJyZPJF2-uvy40Kz0aF7oimyDEJuPPg";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );


  /* =========================
     ACTIVE SESSION
  ========================= */

  let activeSession = null;

  /*
     Stores the name selected by the user
     for their comment.

     Replies will use this same name.
  */

  let activeDisplayName = null;

  let activeIsAnonymous = false;


  /* =========================
     BASIC ELEMENTS
  ========================= */

  const likeButton =
    document.getElementById("likeButton");

  const commentButton =
    document.getElementById("commentButton");

  const shareButton =
    document.getElementById("shareButton");

  const anonymousCheckbox =
    document.getElementById("anonymousCheckbox");

  const commentName =
    document.getElementById("commentName");

  const commentText =
    document.getElementById("commentText");

  const postCommentButton =
    document.getElementById("postCommentButton");

  const commentsList =
    document.getElementById("commentsList");


  /* =========================
     COMMENT CHOICE ELEMENTS
  ========================= */

  const commentChoice =
    document.getElementById("commentChoice");

  const anonymousCommentBtn =
    document.getElementById("anonymousCommentBtn");

  const createAccountBtn =
    document.getElementById("createAccountBtn");

  const signInBtn =
    document.getElementById("signInBtn");

  const closeCommentChoice =
    document.getElementById("closeCommentChoice");


  /* =========================
     LIKE
  ========================= */

  let liked = false;

  if (likeButton) {

    likeButton.addEventListener(
      "click",
      function () {

        liked = !liked;

        if (liked) {
          likeButton.textContent = "♥ Liked";
          likeButton.classList.add("liked");
        } else {
          likeButton.textContent = "♡ Like";
          likeButton.classList.remove("liked");
        }

      }
    );

  }


  /* =========================
     COMMENT BUTTON
  ========================= */

  if (commentButton) {

    commentButton.addEventListener(
      "click",
      function () {

        commentChoice.classList.add("show");

      }
    );

  }


  /* =========================
     CLOSE COMMENT CHOICE
  ========================= */

  if (closeCommentChoice) {

    closeCommentChoice.addEventListener(
      "click",
      function () {

        commentChoice.classList.remove("show");

      }
    );

  }


  if (commentChoice) {

    commentChoice.addEventListener(
      "click",
      function (event) {

        if (event.target === commentChoice) {

          commentChoice.classList.remove("show");

        }

      }
    );

  }


  /* =========================
     GET ACTIVE SESSION
  ========================= */

  async function getActiveSession() {

    if (activeSession && activeSession.user) {
      return activeSession;
    }


    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (sessionError) {

      console.error(
        "Session check error:",
        sessionError
      );

    }


    if (
      sessionData &&
      sessionData.session
    ) {

      activeSession =
        sessionData.session;

      return activeSession;

    }


    const {
      data: anonymousData,
      error: anonymousError
    } =
      await supabaseClient.auth.signInAnonymously();


    if (anonymousError) {

      console.error(
        "Anonymous sign-in error:",
        anonymousError
      );

      throw anonymousError;

    }


    if (
      !anonymousData ||
      !anonymousData.session
    ) {

      throw new Error(
        "Anonymous sign-in succeeded but no session was returned."
      );

    }


    activeSession =
      anonymousData.session;

    return activeSession;

  }


  /* =========================
     CONTINUE AS ANONYMOUS
  ========================= */

  if (anonymousCommentBtn) {

    anonymousCommentBtn.addEventListener(
      "click",
      async function () {

        anonymousCommentBtn.disabled = true;

        anonymousCommentBtn.textContent =
          "Connecting...";


        try {

          const session =
            await getActiveSession();


          if (
            !session ||
            !session.user
          ) {

            throw new Error(
              "No authenticated user session was created."
            );

          }


          activeDisplayName = "Anonymous";
          activeIsAnonymous = true;

          sessionStorage.setItem(
            "dissentverse_comment_name",
            "Anonymous"
          );

          sessionStorage.setItem(
            "dissentverse_comment_anonymous",
            "true"
          );


          commentChoice.classList.remove("show");


          document
            .getElementById("commentsSection")
            .scrollIntoView({
              behavior: "smooth"
            });


          setTimeout(
            function () {

              commentName.value =
                "Anonymous";

              commentName.disabled =
                true;

              anonymousCheckbox.checked =
                true;

              commentText.focus();

            },
            500
          );


        } catch (error) {

          console.error(
            "Anonymous sign-in error:",
            error
          );


          alert(
            "Anonymous sign-in error: " +
            (
              error.message ||
              JSON.stringify(error)
            )
          );


        } finally {

          anonymousCommentBtn.disabled =
            false;

          anonymousCommentBtn.textContent =
            "Continue as Anonymous";

        }

      }
    );

  }


  /* =========================
     CREATE ACCOUNT
  ========================= */

  if (createAccountBtn) {

    createAccountBtn.addEventListener(
      "click",
      function () {

        alert(
          "Account creation will be added next."
        );

      }
    );

  }


  /* =========================
     SIGN IN
  ========================= */

  if (signInBtn) {

    signInBtn.addEventListener(
      "click",
      function () {

        alert(
          "Sign in will be added next."
        );

      }
    );

  }


  /* =========================
     SHARE
  ========================= */

  if (shareButton) {

    shareButton.addEventListener(
      "click",
      async function () {

        const shareData = {

          title: document.title,

          text:
            "Read this article on DissentVerse.",

          url:
            window.location.href

        };


        try {

          if (navigator.share) {

            await navigator.share(
              shareData
            );

          } else {

            await navigator.clipboard.writeText(
              window.location.href
            );

            alert(
              "Article link copied."
            );

          }

        } catch (error) {

          console.log(
            "Share cancelled."
          );

        }

      }
    );

  }


  /* =========================
     ANONYMOUS CHECKBOX
  ========================= */

  anonymousCheckbox.addEventListener(
    "change",
    function () {

      if (
        anonymousCheckbox.checked
      ) {

        commentName.value =
          "Anonymous";

        commentName.disabled =
          true;

      } else {

        commentName.value =
          "";

        commentName.disabled =
          false;

      }

    }
  );


  /* =========================
     LOAD COMMENTS
  ========================= */

  async function loadComments() {

    if (!commentsList) {
      return;
    }


    const articleSlug =
      "{{ page.slug | escape }}";


    const {
      data: comments,
      error
    } =
      await supabaseClient
        .from("comments")
        .select("*")
        .eq(
          "article_slug",
          articleSlug
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    console.log(
      "Comments loaded:",
      comments
    );

    console.log(
      "Comments load error:",
      error
    );


    if (error) {

      console.error(
        "Error loading comments:",
        error
      );

      return;

    }


    commentsList.innerHTML = "";


    if (
      !comments ||
      comments.length === 0
    ) {

      return;

    }


    const commentMap =
      new Map();

    comments.forEach(
      function (comment) {

        commentMap.set(
          comment.id,
          comment
        );

      }
    );


    const childrenMap =
      new Map();


    comments.forEach(
      function (comment) {

        if (!comment.parent_id) {
          return;
        }


        if (
          !childrenMap.has(
            comment.parent_id
          )
        ) {

          childrenMap.set(
            comment.parent_id,
            []
          );

        }


        childrenMap
          .get(comment.parent_id)
          .push(comment);

      }
    );


    function createCommentElement(
      comment
    ) {

      const commentItem =
        document.createElement("div");


      commentItem.className =
        comment.parent_id
          ? "reply-item"
          : "comment-item";


      const author =
        document.createElement("div");


      author.className =
        "comment-author";


      author.textContent =
        comment.display_name ||
        "Anonymous";


      const text =
        document.createElement("div");


      text.className =
        "comment-text";


      text.textContent =
        comment.comment_text;


      const date =
        document.createElement("div");


      date.className =
        "comment-date";


      if (comment.created_at) {

        date.textContent =
          new Date(
            comment.created_at
          ).toLocaleDateString(
            undefined,
            {
              day: "numeric",
              month: "long",
              year: "numeric"
            }
          );

      }


      commentItem.appendChild(
        author
      );

      commentItem.appendChild(
        text
      );

      commentItem.appendChild(
        date
      );


      return commentItem;

    }


    /*
       Creates the reply box.

       IMPORTANT:
       There is NO name field here.

       The reply automatically uses
       the name selected for the user's
       original comment.
    */

    function createReplyBox(
      parentComment,
      parentElement
    ) {

      const replyBox =
        document.createElement("div");


      replyBox.className =
        "reply-box";


      const replyTextarea =
        document.createElement(
          "textarea"
        );


      replyTextarea.placeholder =
        "Write a reply...";


      const submitButton =
        document.createElement(
          "button"
        );


      submitButton.className =
        "reply-submit-btn";


      submitButton.type =
        "button";


      submitButton.textContent =
        "Post Reply";


      const cancelButton =
        document.createElement(
          "button"
        );


      cancelButton.className =
        "reply-cancel-btn";


      cancelButton.type =
        "button";


      cancelButton.textContent =
        "Cancel";


      replyBox.appendChild(
        replyTextarea
      );

      replyBox.appendChild(
        submitButton
      );

      replyBox.appendChild(
        cancelButton
      );


      cancelButton.addEventListener(
        "click",
        function () {

          replyBox.remove();

        }
      );


      submitButton.addEventListener(
        "click",
        async function () {

          const replyText =
            replyTextarea.value.trim();


          if (!replyText) {

            alert(
              "Please write a reply first."
            );

            replyTextarea.focus();

            return;

          }


          submitButton.disabled =
            true;

          submitButton.textContent =
            "Posting...";


          try {

            const session =
              await getActiveSession();


            if (
              !session ||
              !session.user
            ) {

              throw new Error(
                "No authenticated user session was created."
              );

            }


            /*
               Recover the identity selected
               for the original comment.
            */

            let replyDisplayName =
              activeDisplayName;


            let replyIsAnonymous =
              activeIsAnonymous;


            if (!replyDisplayName) {

              replyDisplayName =
                sessionStorage.getItem(
                  "dissentverse_comment_name"
                );

            }


            if (
              !replyDisplayName
            ) {

              replyDisplayName =
                "Anonymous";

            }


            const storedAnonymous =
              sessionStorage.getItem(
                "dissentverse_comment_anonymous"
              );


            if (
              storedAnonymous !== null
            ) {

              replyIsAnonymous =
                storedAnonymous === "true";

            }


            const articleSlug =
              "{{ page.slug | escape }}";


            const {
              error: replyError
            } =
              await supabaseClient
                .from("comments")
                .insert({

                  article_slug:
                    articleSlug,

                  parent_id:
                    parentComment.id,

                  display_name:
                    replyDisplayName,

                  comment_text:
                    replyText,

                  is_anonymous:
                    replyIsAnonymous,

                  approved:
                    true,

                  user_id:
                    session.user.id

                });


            if (replyError) {

              console.error(
                "Reply insert error:",
                replyError
              );


              alert(
                "We could not post your reply: " +
                (
                  replyError.message ||
                  JSON.stringify(replyError)
                )
              );

              return;

            }


            replyBox.remove();

            await loadComments();


          } catch (error) {

            console.error(
              "Reply submission error:",
              error
            );


            alert(
              "Reply error: " +
              (
                error.message ||
                JSON.stringify(error)
              )
            );


          } finally {

            submitButton.disabled =
              false;

            submitButton.textContent =
              "Post Reply";

          }

        }
      );


      parentElement.appendChild(
        replyBox
      );


      replyTextarea.focus();

    }


    /*
       Recursively renders comments.

       This is what allows:

       Comment
         └─ Reply
              └─ Reply
                   └─ Reply
                        └─ ...
    */

    function renderCommentTree(
      comment,
      container
    ) {

      const commentItem =
        createCommentElement(
          comment
        );


      const replyButton =
        document.createElement(
          "button"
        );


      replyButton.className =
        "comment-reply-btn";


      replyButton.type =
        "button";


      replyButton.textContent =
        "Reply";


      replyButton.addEventListener(
        "click",
        function () {

          const existingReplyBox =
            commentItem.querySelector(
              ":scope > .reply-box"
            );


          if (existingReplyBox) {

            existingReplyBox.remove();

            return;

          }


          createReplyBox(
            comment,
            commentItem
          );

        }
      );


      commentItem.appendChild(
        replyButton
      );


      const childComments =
        childrenMap.get(
          comment.id
        ) || [];


      if (
        childComments.length > 0
      ) {

        const repliesContainer =
          document.createElement(
            "div"
          );


        repliesContainer.className =
          "comment-replies";


        childComments.forEach(
          function (child) {

            renderCommentTree(
              child,
              repliesContainer
            );

          }
        );


        commentItem.appendChild(
          repliesContainer
        );

      }


      container.appendChild(
        commentItem
      );

    }


    /*
       Start with top-level comments.
    */

    const topLevelComments =
      comments.filter(
        function (comment) {

          return !comment.parent_id;

        }
      );


    topLevelComments.forEach(
      function (comment) {

        renderCommentTree(
          comment,
          commentsList
        );

      }
    );


    /*
       Show orphan replies instead
       of silently hiding them.
    */

    comments.forEach(
      function (comment) {

        if (
          comment.parent_id &&
          !commentMap.has(
            comment.parent_id
          )
        ) {

          renderCommentTree(
            comment,
            commentsList
          );

        }

      }
    );

  }


  /* =========================
     COMMENT SUBMIT
  ========================= */

  postCommentButton.addEventListener(
    "click",
    async function () {

      const name =
        commentName.value.trim();

      const text =
        commentText.value.trim();


      if (!text) {

        alert(
          "Please write a comment first."
        );

        commentText.focus();

        return;

      }


      postCommentButton.disabled =
        true;

      postCommentButton.textContent =
        "Posting...";


      try {

        const session =
          await getActiveSession();


        if (
          !session ||
          !session.user
        ) {

          throw new Error(
            "No authenticated user session was created."
          );

        }


        activeSession =
          session;


        const user =
          session.user;


        const displayName =
          anonymousCheckbox.checked
            ? "Anonymous"
            : (
                name ||
                "Anonymous"
              );


        const isAnonymous =
          anonymousCheckbox.checked ||
          user.is_anonymous === true;


        /*
           SAVE THE NAME FOR FUTURE REPLIES
        */

        activeDisplayName =
          displayName;

        activeIsAnonymous =
          isAnonymous;


        sessionStorage.setItem(
          "dissentverse_comment_name",
          displayName
        );


        sessionStorage.setItem(
          "dissentverse_comment_anonymous",
          String(isAnonymous)
        );


        const articleSlug =
          "{{ page.slug | escape }}";


        console.log(
          "Commenting user:",
          user.id
        );


        console.log(
          "Article slug:",
          articleSlug
        );


        const {
          error: insertError
        } =
          await supabaseClient
            .from("comments")
            .insert({

              article_slug:
                articleSlug,

              parent_id:
                null,

              display_name:
                displayName,

              comment_text:
                text,

              is_anonymous:
                isAnonymous,

              approved:
                true,

              user_id:
                user.id

            });


        if (insertError) {

          console.error(
            "Comment insert error:",
            insertError
          );


          alert(
            "We could not post your comment: " +
            (
              insertError.message ||
              JSON.stringify(insertError)
            )
          );


          return;

        }


        commentText.value =
          "";


        /*
           Keep the selected identity
           available for replies.
        */

        if (
          anonymousCheckbox.checked
        ) {

          commentName.value =
            "Anonymous";

          commentName.disabled =
            true;

        } else {

          commentName.value =
            displayName;

          commentName.disabled =
            false;

        }


        await loadComments();


        alert(
          "Your comment has been posted."
        );


      } catch (error) {

        console.error(
          "Comment submission error:",
          error
        );


        alert(
          "Comment error: " +
          (
            error.message ||
            JSON.stringify(error)
          )
        );


      } finally {

        postCommentButton.disabled =
          false;

        postCommentButton.textContent =
          "Post Comment";

      }

    }
  );


  /* =========================
     SUPABASE AUTH STATE
  ========================= */

  supabaseClient.auth.onAuthStateChange(
    function (
      event,
      session
    ) {

      console.log(
        "Auth event:",
        event
      );


      if (session) {

        activeSession =
          session;

      }

    }
  );


  /* =========================
     LOAD EXISTING SESSION
  ========================= */

  (async function () {

    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {

        console.error(
          "Supabase session error:",
          error
        );

        return;

      }


      if (
        data &&
        data.session
      ) {

        activeSession =
          data.session;

        console.log(
          "Existing session loaded."
        );

      } else {

        console.log(
          "No existing session."
        );

      }


      /*
         Restore the user's selected
         commenting identity after reload.
      */

      const storedName =
        sessionStorage.getItem(
          "dissentverse_comment_name"
        );


      const storedAnonymous =
        sessionStorage.getItem(
          "dissentverse_comment_anonymous"
        );


      if (storedName) {

        activeDisplayName =
          storedName;

        activeIsAnonymous =
          storedAnonymous === "true";

      }


    } catch (error) {

      console.error(
        "Supabase initialization error:",
        error
      );

    }

  })();


  /* =========================
     LOAD COMMENTS ON PAGE LOAD
  ========================= */

  loadComments();

</script>

</body>
</html>
