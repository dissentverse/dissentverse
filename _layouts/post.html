<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | DissentVerse</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #fff;
      color: #171717;
    }

    /* HEADER */

    .article-header {
      border-bottom: 1px solid #eee;
      padding: 22px 30px;
    }

    .article-header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
    }

    .brand {
      color: #171717;
      text-decoration: none;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: -0.5px;
    }

    .brand span {
      color: #b02a72;
    }

    .tagline {
      margin-top: 3px;
      color: #777;
      font-size: 11px;
      font-style: italic;
      letter-spacing: 0.3px;
    }

    .header-link {
      color: #555;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
    }

    .header-link:hover {
      color: #b02a72;
    }

    /* ARTICLE */

    .article-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 75px 25px 100px;
    }

    .article-label {
      display: inline-block;
      color: #b02a72;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .article-title {
      font-size: 56px;
      line-height: 1.12;
      letter-spacing: -1.5px;
      margin: 0 0 22px;
      color: #171717;
    }

    .article-date {
      color: #777;
      font-size: 14px;
      margin-bottom: 45px;
    }

    /* FEATURED IMAGE */

    .featured-image {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      border-radius: 20px;
      display: block;
      margin-bottom: 55px;
    }

    /* ARTICLE CONTENT */

    .article-content {
      max-width: 760px;
      margin: 0 auto;
      font-size: 19px;
      line-height: 1.85;
      color: #292929;
    }

    .article-content p {
      margin: 0 0 25px;
    }

    .article-content h2 {
      font-size: 30px;
      line-height: 1.3;
      margin: 55px 0 20px;
      color: #171717;
    }

    .article-content h3 {
      font-size: 24px;
      line-height: 1.4;
      margin: 40px 0 15px;
      color: #171717;
    }

    .article-content strong {
      color: #171717;
    }

    .article-content em {
      color: #444;
    }

    .article-content a {
      color: #b02a72;
      font-weight: bold;
    }

    .article-content ul,
    .article-content ol {
      margin: 20px 0 30px;
      padding-left: 30px;
    }

    .article-content li {
      margin-bottom: 10px;
    }

    /* BACK LINK */

    .back-link {
      display: inline-block;
      margin-top: 55px;
      color: #b02a72;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* FOOTER */

    .article-footer {
      border-top: 1px solid #eee;
      text-align: center;
      padding: 30px 20px;
      color: #777;
      font-size: 13px;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .article-header {
        padding: 18px 20px;
      }

      .article-header-inner {
        align-items: flex-start;
      }

      .brand {
        font-size: 21px;
      }

      .tagline {
        font-size: 10px;
      }

      .header-link {
        font-size: 14px;
        margin-top: 4px;
      }

      .article-page {
        padding: 50px 20px 70px;
      }

      .article-title {
        font-size: 38px;
        letter-spacing: -0.8px;
      }

      .article-date {
        margin-bottom: 35px;
      }

      .featured-image {
        border-radius: 14px;
        margin-bottom: 40px;
      }

      .article-content {
        font-size: 17px;
        line-height: 1.8;
      }

      .article-content h2 {
        font-size: 26px;
      }

      .article-content h3 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <header class="article-header">
    <div class="article-header-inner">

      <div class="brand-block">
        <a class="brand" href="{{ site.baseurl }}/">
          Dissent<span>Verse</span>
        </a>

        <div class="tagline">
          Where Dissent finds its Verse.
        </div>
      </div>

      <a class="header-link" href="{{ site.baseurl }}/articles.html">
        All Articles
      </a>

    </div>
  </header>


  <main class="article-page">

    <div class="article-label">
      Article
    </div>

    <h1 class="article-title">
      {{ page.title }}
    </h1>

    <div class="article-date">
      {{ page.date | date: "%d %B %Y" }}
    </div>

    {% if page.featured_image %}
      <img
        class="featured-image"
        src="{{ page.featured_image | relative_url }}"
        alt="{{ page.title }}"
      >
    {% endif %}

    <article class="article-content">
      {{ content }}
    </article>

    <a class="back-link" href="{{ site.baseurl }}/articles.html">
      ← Back to Articles
    </a>

  </main>


  <footer class="article-footer">
    © 2026 DissentVerse · Where Dissent finds its Verse.
  </footer>

</body>
</html>
