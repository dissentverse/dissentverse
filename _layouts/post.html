<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | DissentVerse</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: #29242a;

      background:
        radial-gradient(circle at 5% 10%, rgba(248, 210, 230, 0.6), transparent 30%),
        radial-gradient(circle at 95% 15%, rgba(225, 214, 245, 0.6), transparent 30%),
        linear-gradient(135deg, #fff7fb, #f7f2fc);

      min-height: 100vh;
    }

    /* HEADER */

    .site-header {
      background: rgba(255, 255, 255, 0.82);
      border-bottom: 1px solid rgba(190, 150, 180, 0.18);
      backdrop-filter: blur(8px);
      padding: 22px 30px;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
    }

    .brand {
      color: #171717;
      text-decoration: none;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: -0.5px;
    }

    .brand span {
      color: #b02a72;
    }

    .tagline {
      margin-top: 3px;
      color: #777;
      font-size: 11px;
      font-style: italic;
    }

    .navigation {
      display: flex;
      gap: 24px;
    }

    .navigation a {
      color: #4f4a50;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .navigation a:hover {
      color: #b02a72;
    }

    /* ARTICLE */

    .article-page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 75px 25px 100px;
    }

    .article-container {
      background: rgba(255, 255, 255, 0.91);

      border: 1px solid rgba(190, 150, 180, 0.2);
      border-radius: 28px;

      padding: 65px 70px;

      box-shadow:
        0 18px 50px rgba(100, 60, 100, 0.08);
    }

    .article-label {
      color: #b02a72;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;

      margin-bottom: 18px;
    }

    .article-title {
      font-size: 55px;
      line-height: 1.12;
      letter-spacing: -1.5px;

      margin: 0 0 20px;
      color: #171717;
    }

    .article-date {
      color: #777;
      font-size: 14px;
      margin-bottom: 45px;
    }

    /* FEATURED IMAGE */

    .featured-image {
      width: 100%;
      max-height: 520px;
      object-fit: cover;

      display: block;

      border-radius: 20px;
      margin-bottom: 50px;
    }

    /* CONTENT */

    .article-content {
      max-width: 760px;
      margin: 0 auto;

      font-size: 19px;
      line-height: 1.9;

      color: #302b31;
    }

    .article-content p {
      margin: 0 0 27px;
    }

    .article-content h2 {
      font-size: 31px;
      line-height: 1.3;

      margin: 55px 0 20px;

      color: #171717;
    }

    .article-content h3 {
      font-size: 25px;
      line-height: 1.4;

      margin: 40px 0 15px;

      color: #171717;
    }

    .article-content strong {
      color: #171717;
    }

    .article-content em {
      color: #514951;
    }

    .article-content a {
      color: #b02a72;
      font-weight: bold;
    }

    .article-content ul,
    .article-content ol {
      margin: 20px 0 30px;
      padding-left: 30px;
    }

    .article-content li {
      margin-bottom: 10px;
    }

    /* BACK LINK */

    .back-link {
      display: inline-block;

      margin-top: 55px;

      color: #b02a72;
      text-decoration: none;

      font-size: 15px;
      font-weight: bold;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* FOOTER */

    .site-footer {
      text-align: center;

      padding: 30px 20px;

      border-top: 1px solid rgba(190, 150, 180, 0.2);

      color: #777;
      font-size: 13px;

      background: rgba(255, 255, 255, 0.45);
    }

    /* MOBILE */

    @media (max-width: 750px) {

      .site-header {
        padding: 18px 20px;
      }

      .header-inner {
        align-items: flex-start;
      }

      .brand {
        font-size: 21px;
      }

      .tagline {
        font-size: 10px;
      }

      .navigation {
        gap: 12px;
      }

      .navigation a {
        font-size: 12px;
      }

      .article-page {
        padding: 45px 15px 65px;
      }

      .article-container {
        padding: 40px 25px;
        border-radius: 22px;
      }

      .article-title {
        font-size: 38px;
        letter-spacing: -0.8px;
      }

      .article-date {
        margin-bottom: 35px;
      }

      .featured-image {
        border-radius: 14px;
        margin-bottom: 40px;
      }

      .article-content {
        font-size: 17px;
        line-height: 1.8;
      }

      .article-content h2 {
        font-size: 26px;
      }

      .article-content h3 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">

    <div class="header-inner">

      <div class="brand-block">

        <a class="brand" href="{{ site.baseurl }}/">
          Dissent<span>Verse</span>
        </a>

        <div class="tagline">
          Where Dissent finds its Verse.
        </div>

      </div>


      <nav class="navigation">

        <a href="{{ site.baseurl }}/">
          Home
        </a>

        <a href="{{ site.baseurl }}/about.html">
          About
        </a>

        <a href="{{ site.baseurl }}/articles.html">
          Articles
        </a>

      </nav>

    </div>

  </header>


  <main class="article-page">

    <article class="article-container">

      <div class="article-label">
        Article
      </div>


      <h1 class="article-title">
        {{ page.title }}
      </h1>


      <div class="article-date">
        {{ page.date | date: "%d %B %Y" }}
      </div>


      {% if page.featured_image %}

        <img
          class="featured-image"
          src="{{ page.featured_image | relative_url }}"
          alt="{{ page.title }}"
        >

      {% endif %}


      <div class="article-content">

        {{ content }}

      </div>


      <a
        class="back-link"
        href="{{ site.baseurl }}/articles.html"
      >
        ← Back to Articles
      </a>

    </article>

  </main>


  <footer class="site-footer">

    © 2026 DissentVerse · Where Dissent finds its Verse.

  </footer>

</body>
</html>
