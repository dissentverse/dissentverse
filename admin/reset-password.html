<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DissentVerse — Reset Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f9;
      color: #222;
    }

    .header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 20px 30px;
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
    }

    .brand span {
      color: #B02A72;
    }

    .container {
      max-width: 450px;
      margin: 80px auto;
      padding: 0 20px;
    }

    .box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 30px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #b00020;
    }

    .success {
      color: #287a3e;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #B02A72;
      text-decoration: none;
      font-size: 14px;
    }

    #resetBox {
      display: none;
    }

    #loadingBox {
      text-align: center;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">
      Dissent<span>Verse</span>
    </div>
  </header>

  <main class="container">

    <!-- LOADING -->
    <section class="box" id="loadingBox">

      <h1>Verifying reset link...</h1>

      <p class="subtitle">
        Please wait while we securely verify your password reset link.
      </p>

      <div id="loadingMessage" class="message"></div>

    </section>


    <!-- PASSWORD RESET -->
    <section class="box" id="resetBox">

      <h1>Create a new password</h1>

      <p class="subtitle">
        Enter a new password for your DissentVerse admin account.
      </p>

      <form id="resetForm">

        <div class="field">
          <label for="password">New Password</label>

          <input
            type="password"
            id="password"
            minlength="8"
            required
            autocomplete="new-password"
            placeholder="Enter new password"
          >
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            minlength="8"
            required
            autocomplete="new-password"
            placeholder="Enter password again"
          >
        </div>

        <button
          type="submit"
          class="button"
          id="updateButton"
        >
          Update Password
        </button>

      </form>

      <div id="message" class="message"></div>

      <a
        href="/dissentverse/admin/comments.html"
        class="back-link"
      >
        Back to Admin Login
      </a>

    </section>

  </main>


  <script>

    const SUPABASE_URL =
      "https://yplvpgigfkihgmyfsqyl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_wnafq5zQ9Y2b9WsH-j5U9Q_WmcgV1L";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    const loadingBox =
      document.getElementById("loadingBox");

    const resetBox =
      document.getElementById("resetBox");

    const loadingMessage =
      document.getElementById("loadingMessage");

    const resetForm =
      document.getElementById("resetForm");

    const updateButton =
      document.getElementById("updateButton");

    const message =
      document.getElementById("message");


    function showResetForm() {

      loadingBox.style.display = "none";
      resetBox.style.display = "block";

    }


    function showError(text) {

      loadingMessage.textContent = text;
      loadingMessage.className = "message error";

    }


    /*
      Supabase sends PASSWORD_RECOVERY when the
      password-reset link successfully creates
      the recovery session.
    */

    supabaseClient.auth.onAuthStateChange(
      function(event, session) {

        console.log("Auth event:", event);

        if (
          event === "PASSWORD_RECOVERY" &&
          session
        ) {

          showResetForm();

        }

      }
    );


    /*
      Give Supabase a moment to process the
      recovery link and create the session.
    */

    async function initialize() {

      try {

        const {
          data,
          error
        } = await supabaseClient.auth.getSession();


        if (error) {

          console.error(
            "Session error:",
            error
          );

          showError(
            "Unable to verify the reset link."
          );

          return;

        }


        /*
          If the recovery session has already
          been established, show the form.
        */

        if (data.session) {

          showResetForm();

          return;

        }


        /*
          If there is no session yet, the
          PASSWORD_RECOVERY event may still
          be processing.
        */

        setTimeout(
          async function() {

            const {
              data: sessionData
            } =
              await supabaseClient.auth.getSession();


            if (sessionData.session) {

              showResetForm();

            } else {

              showError(
                "This password reset link is invalid or has expired. Please request a new password reset email."
              );

            }

          },
          1500
        );


      } catch (error) {

        console.error(
          "Initialization error:",
          error
        );

        showError(
          "Unable to verify the reset link."
        );

      }

    }


    resetForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;


        message.textContent = "";
        message.className = "message";


        if (password !== confirmPassword) {

          message.textContent =
            "Passwords do not match.";

          message.className =
            "message error";

          return;

        }


        if (password.length < 8) {

          message.textContent =
            "Password must be at least 8 characters.";

          message.className =
            "message error";

          return;

        }


        updateButton.disabled = true;

        updateButton.textContent =
          "Updating...";


        try {

          /*
            At this point Supabase should have
            established the recovery session.
          */

          const {
            data,
            error
          } =
            await supabaseClient.auth.updateUser({
              password: password
            });


          if (error) {

            throw error;

          }


          message.textContent =
            "Password updated successfully. You can now log in.";

          message.className =
            "message success";


          resetForm.reset();

          updateButton.disabled = false;

          updateButton.textContent =
            "Update Password";


        } catch (error) {

          console.error(
            "Password update error:",
            error
          );

          message.textContent =
            error.message ||
            "Unable to update your password.";

          message.className =
            "message error";


          updateButton.disabled = false;

          updateButton.textContent =
            "Update Password";

        }

      }
    );


    initialize();

  </script>

</body>
</html>
