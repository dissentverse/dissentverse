<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DissentVerse — Reset Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f9;
      color: #222;
    }

    .header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 20px 30px;
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
    }

    .brand span {
      color: #B02A72;
    }

    .container {
      max-width: 450px;
      margin: 80px auto;
      padding: 0 20px;
    }

    .box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 30px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #b00020;
    }

    .success {
      color: #287a3e;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #B02A72;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">
      Dissent<span>Verse</span>
    </div>
  </header>

  <main class="container">

    <section class="box">

      <h1>Create a new password</h1>

      <p class="subtitle">
        Enter a new password for your DissentVerse admin account.
      </p>

      <form id="resetForm">

        <div class="field">
          <label for="password">New Password</label>

          <input
            type="password"
            id="password"
            minlength="8"
            required
            autocomplete="new-password"
            placeholder="Enter new password"
          >
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            minlength="8"
            required
            autocomplete="new-password"
            placeholder="Enter password again"
          >
        </div>

        <button
          type="submit"
          class="button"
          id="updateButton"
        >
          Update Password
        </button>

      </form>

      <div id="message" class="message"></div>

      <a
        href="/dissentverse/admin/comments.html"
        class="back-link"
      >
        Back to Admin Login
      </a>

    </section>

  </main>

  <script>

    const SUPABASE_URL =
      "https://yplvpgigfkihgmyfsqyl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_wnafq5zQ9Y2b9WsH-j5U9Q_WmcgV1L";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    const resetForm =
      document.getElementById("resetForm");

    const updateButton =
      document.getElementById("updateButton");

    const message =
      document.getElementById("message");


    resetForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;


        message.textContent = "";
        message.className = "message";


        if (password !== confirmPassword) {

          message.textContent =
            "Passwords do not match.";

          message.className =
            "message error";

          return;
        }


        updateButton.disabled = true;

        updateButton.textContent =
          "Updating...";


        try {

          const { data, error } =
            await supabaseClient.auth.updateUser({
              password: password
            });


          if (error) {
            throw error;
          }


          message.textContent =
            "Password updated successfully. You can now log in.";

          message.className =
            "message success";


          resetForm.reset();

          updateButton.disabled = false;

          updateButton.textContent =
            "Update Password";


        } catch (error) {

          console.error(
            "Password update error:",
            error
          );

          message.textContent =
            error.message ||
            "Unable to update password.";

          message.className =
            "message error";

          updateButton.disabled = false;

          updateButton.textContent =
            "Update Password";
        }

      }
    );

  </script>

</body>
</html>
