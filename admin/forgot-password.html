<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DissentVerse — Forgot Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f9;
      color: #222;
    }

    .header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 20px 30px;
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
    }

    .brand span {
      color: #B02A72;
    }

    .container {
      max-width: 450px;
      margin: 80px auto;
      padding: 0 20px;
    }

    .box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 30px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #b00020;
    }

    .success {
      color: #287a3e;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #B02A72;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">
      Dissent<span>Verse</span>
    </div>
  </header>

  <main class="container">

    <section class="box">

      <h1>Forgot Password?</h1>

      <p class="subtitle">
        Enter your admin email address and we will send you a password
        reset link.
      </p>

      <form id="forgotPasswordForm">

        <div class="field">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            required
            autocomplete="email"
            placeholder="Enter your email address"
          >

        </div>

        <button
          type="submit"
          class="button"
          id="sendButton"
        >
          Send Reset Link
        </button>

      </form>

      <div
        id="message"
        class="message"
      ></div>

      <a
        href="/dissentverse/admin/comments.html"
        class="back-link"
      >
        Back to Admin Login
      </a>

    </section>

  </main>


  <script>

    const SUPABASE_URL =
      "https://yplvpgigfkihgmyfsqyl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_wnafq5zQ9Y2b9WsH-j5U9Q_WmcgV1L";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    const form =
      document.getElementById("forgotPasswordForm");

    const emailInput =
      document.getElementById("email");

    const sendButton =
      document.getElementById("sendButton");

    const message =
      document.getElementById("message");


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        message.textContent = "";
        message.className = "message";

        sendButton.disabled = true;
        sendButton.textContent = "Sending...";


        try {

          const { error } =
            await supabaseClient.auth.resetPasswordForEmail(
              email,
              {
                redirectTo:
                  "https://dissentverse.github.io/dissentverse/admin/reset-password.html"
              }
            );


          if (error) {
            throw error;
          }


          /*
            We intentionally show the same message regardless
            of whether the email belongs to an account.
            This avoids revealing whether an account exists.
          */

          message.textContent =
            "If an account exists with this email address, a password reset link has been sent. Please check your inbox.";

          message.className =
            "message success";


          form.reset();


        } catch (error) {

          console.error(
            "Password reset request error:",
            error
          );

          message.textContent =
            "Unable to send the reset email right now. Please try again later.";

          message.className =
            "message error";

        }


        sendButton.disabled = false;
        sendButton.textContent = "Send Reset Link";

      }
    );

  </script>

</body>
</html>
